name: Florida DEP septic inventory aggregates
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch_septic_inventory.py'
      - 'scripts/publish_inventory_snapshot.py'
      - 'scripts/validate_alpha.py'
      - 'tests/test_inventory_publication.py'
      - '.github/workflows/septic-inventory.yml'
  schedule:
    - cron: '43 11 * * *'
permissions:
  contents: write
concurrency:
  group: septic-inventory
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run inventory publication regression tests
        run: python -m unittest discover -s tests -v
      - name: Fetch aggregate inventory from official DEP ArcGIS REST endpoint
        run: python scripts/fetch_septic_inventory.py
      - name: Validate source schemas and evidence-only publication
        run: python scripts/validate_alpha.py
      - name: Publish only if candidate is newer than current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/septic-inventory-aggregate.json "$RUNNER_TEMP/septic-inventory-aggregate.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/publish_inventory_snapshot.py \
              --candidate "$RUNNER_TEMP/septic-inventory-aggregate.json" \
              --output data/septic-inventory-aggregate.json
            python scripts/validate_alpha.py
            git add data/septic-inventory-aggregate.json
            if git diff --cached --quiet; then
              echo "Latest validated inventory snapshot already published"
              exit 0
            fi
            git commit -m "Refresh official Florida septic inventory aggregates"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying against current main" >&2
            sleep $((attempt * 2))
          done
          echo "Unable to publish after five safe non-force attempts" >&2
          exit 1
