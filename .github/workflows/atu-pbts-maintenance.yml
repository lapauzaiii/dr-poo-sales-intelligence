name: Official ATU PBTS maintenance intelligence
on:
  workflow_dispatch:
  schedule:
    - cron: '07 12 * * *'
  push:
    paths:
      - 'scripts/fetch_maintenance_entities.py'
      - 'scripts/fetch_product_maintenance.py'
      - 'scripts/validate_alpha.py'
      - 'scripts/check_frontend.py'
      - 'scripts/build_static.py'
      - 'prototype/**'
      - 'tests/**'
      - '.github/workflows/atu-pbts-maintenance.yml'
permissions:
  contents: write
concurrency:
  group: official-atu-maintenance
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF text extraction
        run: |
          if ! command -v pdftotext >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y poppler-utils
          fi
      - name: Run parser tests
        run: python -m unittest discover -s tests -v
      - name: Check production frontend and JavaScript
        run: python scripts/check_frontend.py
      - name: Fetch and parse official DEP maintenance entity report
        run: python scripts/fetch_maintenance_entities.py
      - name: Fetch and parse newer official DEP product report
        run: python scripts/fetch_product_maintenance.py
      - name: Validate all public data and fail closed
        run: python scripts/validate_alpha.py
      - name: Validate allowlisted production bundle
        run: python scripts/build_static.py
      - name: Publish validated maintenance snapshot without overwriting newer data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/maintenance-entities.json "$RUNNER_TEMP/maintenance-entities.json"
          cp data/maintenance-products.json "$RUNNER_TEMP/maintenance-products.json"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            python - "$RUNNER_TEMP" <<'PY'
          import json, pathlib, shutil, sys
          root=pathlib.Path("data")
          temp=pathlib.Path(sys.argv[1])
          for name in ("maintenance-entities.json","maintenance-products.json"):
              dest=root/name
              candidate=temp/name
              new=json.loads(candidate.read_text())
              old=json.loads(dest.read_text())
              if (old.get("report_date") or "") > (new.get("report_date") or ""):
                  print("Preserving newer report",name)
                  continue
              if old.get("source_sha256")==new.get("source_sha256") and (old.get("retrieved_at") or "") >= (new.get("retrieved_at") or ""):
                  print("Preserving already refreshed snapshot",name)
                  continue
              shutil.copyfile(candidate,dest)
          PY
            python scripts/validate_alpha.py
            git add data/maintenance-entities.json data/maintenance-products.json
            if git diff --cached --quiet; then
              echo "Latest validated snapshots already published"
              exit 0
            fi
            git commit -m "Refresh verified DEP maintenance entity permissions"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Concurrent update detected; retrying against current main" >&2
            sleep $((attempt * 2))
          done
          echo "Unable to publish after five safe non-force attempts" >&2
          exit 1
